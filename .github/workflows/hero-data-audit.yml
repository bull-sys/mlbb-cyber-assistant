name: Hero data audit

on:
  push:
    branches:
      - assistant/cyber-redesign-2
    paths:
      - "server/hero-reference-data.js"
      - "server/hero-catalog.js"
      - "server/hero-growth-adapter.js"
      - "scripts/audit-hero-data.mjs"
      - "scripts/audit-hero-content.mjs"
      - ".github/workflows/hero-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-data-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit all 133 hero records and source pages
        run: node scripts/audit-hero-data.mjs
      - name: Audit biographies and Russian skill descriptions for all heroes
        run: node scripts/audit-hero-content.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: hero-data-audit
          path: |
            artifacts/hero-data-audit.json
            artifacts/hero-content-audit.json
          if-no-files-found: error
          retention-days: 14
