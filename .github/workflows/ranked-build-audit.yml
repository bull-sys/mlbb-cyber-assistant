name: Ranked Build Data Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ranked-build-data-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit ranked builds for all heroes
        run: npm run audit:builds
      - name: Upload ranked build coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlbbdex-build-coverage
          path: artifacts/mlbbdex-build-coverage.json
          if-no-files-found: ignore
          retention-days: 30
