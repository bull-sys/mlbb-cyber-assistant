name: Tests

on:
  push:
    branches:
      - main
      - feature/hero-data-schema
      - assistant/permission-check
      - assistant/cyber-redesign-2
  pull_request:
    branches:
      - main
      - feature/hero-data-schema

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Validate scheduled build audit script syntax
        run: node --check scripts/audit-mlbbdex-build-coverage.mjs
      - name: Audit live item catalog and artwork
        run: node scripts/audit-item-assets.mjs
      - name: Build production Docker image
        run: docker build -t mlbb-cyber-assistant:test .
